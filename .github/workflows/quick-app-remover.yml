
name: Quick app remover

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-testing-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh testing branch
        run: |
          git checkout -B testing origin/main

      - name: Check scripts
        run: |
          cd programs || exit 1

          scripts="evalit"

          architectures=$(ls -d */ | tr '/' ' ' | xargs)
          echo "----------------------------------------------------"
          printf "Remove scripts:\n\n"
          for s in $scripts; do
            for a in $architectures; do
              [ -f "$a"/"$s" ] && rm -f "$a"/"$s" && echo "programs/$a/$s"
            done
          done
          echo "Done!"

          echo "----------------------------------------------------"
          printf "Update lists:\n\n"
          ./lister.sh

          echo "----------------------------------------------------"

      - name: Commit and push testing
        run: |
          git config --global user.name "web-flow"
          git config --global user.email "noreply@github.com"
          git checkout -b dead-app-removal
          git add programs
          git commit -m "Remove apps that did not pass the test" || echo "No changes to commit"
          git push origin dead-app-removal --force
          printf '{"title":"Remove apps that did not pass the test","head":"dead-app-removal","base":"%s","body":""}' "$base" > /tmp/pull.json
          code=$(curl -sS -o /tmp/pull-reply.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL/pulls" \
            --data-binary @/tmp/pull.json)
          if [ "$code" = 201 ]; then
            echo "Opened the site pull request"
          elif [ "$code" = 422 ] && grep -q 'already exists' /tmp/pull-reply.json; then
            echo "Pull request already open; pushed the new commit onto it"
          else
            echo "::error::Opening the site pull request failed (HTTP $code)"
            cat /tmp/pull-reply.json
            exit 1
          fi
