name: Auto-label AM or AppMan

on:
  issues:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Apply Label based on form selection
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.issue.body;
            let labelToAdd = null;

            // Check what the user selected in the dropdown field
            if (body.includes('### Are you using "AM" or "AppMan"?\n\nAM')) {
              labelToAdd = 'AM';
            } else if (body.includes('### Are you using "AM" or "AppMan"?\n\nAppMan')) {
              labelToAdd = 'AppMan';
            }

            if (labelToAdd) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: [labelToAdd]
              });
            }
