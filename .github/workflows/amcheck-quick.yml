
name: AMCHECK (quick)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-or-update-testing-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh testing branch
        run: |
          git checkout -B testing origin/main

      - name: Check scripts
        run: |
          cd programs || exit 1
          architectures=$(ls -d */ | tr '/' ' ' | xargs)
          scripts="evalit"
          for s in $scripts; do
            for a in $architectures; do
              rm -f "$a"/"$f" && echo "Removed $a/$f"
            done
          done

      - name: Commit and push testing
        run: |
          git config --global user.name "web-flow"
          git config --global user.email "noreply@github.com"
          git add programs/*/*
          git commit -m "Remove apps that did not pass the test" || echo "No changes to commit"
          git push origin testing --force
