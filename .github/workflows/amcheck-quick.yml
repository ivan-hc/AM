
name: AMCHECK (quick)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-or-update-testing-branch:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout latest main
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. Configure web-flow as author
      - name: Configure Git author
        run: |
          git config user.name "web-flow"
          git config user.email "noreply@github.com"

      # 3. Create or refresh testing from main
      - name: Refresh testing branch
        run: |
          git checkout -B testing origin/main

      # 4. Add file
      - name: Check scripts
        run: |
          echo "This file was automatically generated." > testing.txt

      # 5. Commit and push
      - name: Commit and push testing
        run: |
          git add testing.txt
          git commit -m "Remove apps that did not pass the test" || echo "No changes to commit"
          git push origin testing --force
